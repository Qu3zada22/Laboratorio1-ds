[project]
name = "laboratorio1-ds"
version = "0.1.0"
description = "Laboratorio de series de tiempo sobre viajeros internacionales"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.8",
    "matplotlib==3.10.8",
    "nbconvert>=7.16.6",
    "numpy==2.4.4",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "pmdarima==2.1.1",
    "plotly>=6.3.0",
    "prophet==1.3.0",
    "pycatch22>=0.4.5",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "seaborn>=0.13.2",
    "statsmodels==0.14.6",
    "tensorflow>=2.20.0",
    "weasyprint>=66.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.10.2",
]
